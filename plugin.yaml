name: hyperliquid-desk
version: 1.0.0
description: Live Hyperliquid dashboard tab, market tools and a commentary skill on Hyperliquid's public data, with node panels from a hosted relay (on by default, can be turned off) or your own engine feed. Read-only; no orders, no trading keys.
author: KevinM0001
manifest_version: 2
api_version: 1
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - hl_market
  - hl_flow
  - hl_context
  - hl_status
  - hl_alerts
  - hl_wallets
  - hl_candles
  - hl_structure
  - hl_watch
  - node_status
  - node_book
  - node_stops
provides_hooks: []
tags: [hyperliquid, markets, dashboard, read-only]
config_schema:
  markets:
    type: list
    default: ["BTC", "HYPE", "xyz:SP500", "xyz:XYZ100"]
    label: Markets
    description: Hyperliquid market names to follow. Each must pass the metadata check (info perpDexs + meta); unknown markets are unsupported.
  burst_min_usd:
    type: dict
    default: {"BTC": 10000000, "HYPE": 2000000, "xyz:SP500": 1000000, "xyz:XYZ100": 1000000}
    label: Burst alert threshold (USD per 60 s)
    description: Public mode. Aggressive buying or selling at or above this notional within 60 s raises a burst alert, per market. Node mode uses node_burst_min_usd instead.
  node_burst_min_usd:
    type: dict
    default: {}
    label: Node-mode burst threshold (USD per 60 s, manual override)
    description: Node mode. A manual burst threshold per market in USD, for example BTC 25000000. A market not listed, or listed as auto, uses the automatic threshold from the dated burst calibration (about 10 a day, measured Nov 3 to 7).
  large_print_usd:
    type: dict
    default: {"BTC": 250000, "HYPE": 100000, "xyz:SP500": 50000, "xyz:XYZ100": 50000}
    label: Large print threshold (USD)
    description: A single public trade at or above this notional is listed as a large print, per market.
  clock_error_bound_ms:
    type: float
    default: 0
    label: Clock error bound (ms)
    description: Only needed where the OS can't report its clock error bound (for example macOS, or an unsynchronized clock). The local clock's maximum error, used to judge whether source timestamps are recent; 0 means "ask the OS".
  wallet_target_share_pct:
    type: float
    default: 50
    label: Wallet list target share (%)
    description: The wallets panel lists the shortest ranked set reaching this share of its side, capped at 50 wallets.
  node_feed:
    type: str
    default: "hosted"
    label: Node feed
    description: Where the node panels get their data. "hosted" (the default) uses the plugin author's hosted relay, a third-party network call, free for now; data flows only while a node panel is on screen (and for 60 s after the tab was last visible) or a node tool is answering. "off" means public mode only. Or a local Unix socket path (the l4-runner live feed) or a relay WebSocket URL (wss://...) of your own.
  node_alerts:
    type: bool
    default: false
    label: Node alerts in the background
    description: With a relay, keep receiving the four markets' executions (about 9 KB/s) while no node panel is on screen, so node-mode burst and liquidation alerts keep running. Off, node data stops 60 s after the last node panel was seen.
  node_key:
    type: secret
    env: HL_DESK_NODE_KEY
    required: false
    label: Node feed access key
    description: Optional and unused by the hosted relay at launch (it needs no key). Sent only to a relay WebSocket URL, as an Authorization header, never after a redirect. Not needed for a local socket or a relay without keys.
  node_replay_file:
    type: str
    default: ""
    label: Node replay recording
    description: Optional. A recording made by the engine's recorder, played only when you start a replay (/hl replay start). Replays are labelled REPLAY and never mixed with live data.
  liq_burst_count:
    type: int
    default: 2
    label: Liquidation burst (count per 60 s)
    description: Node mode. This many liquidations within 60 s of block time raise a liquidation burst alert, per market. Each liquidation counts once, for the liquidated trader.
  liq_burst_usd:
    type: float
    default: 1000000
    label: Liquidation burst (USD per 60 s)
    description: Node mode. Liquidated notional at or above this within 60 s raises a liquidation burst alert, per market.
